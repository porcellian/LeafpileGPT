name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    env:
      AVALONIA_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LeafpileGPT.sln

      - name: Build
        run: dotnet build LeafpileGPT.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LeafpileGPT.sln --configuration Release --no-build
